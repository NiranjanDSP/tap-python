input_dir: "../"
output_dir: "output"
bad_records_dir: "bad_records"
log_dir: "logs"
manifest_path: "output/manifest.json"
max_rejection_percent: 20.0

datasets:
  customers:
    file: "olist_customers_dataset.csv"
    required_columns: [customer_id, customer_unique_id, customer_zip_code_prefix, customer_city, customer_state]
    column_mapping: {customer_id: customer_id, customer_unique_id: customer_unique_id, customer_zip_code_prefix: customer_zip_code_prefix, customer_city: customer_city, customer_state: customer_state}
    id_columns: [customer_id, customer_unique_id]
    zip_columns: [customer_zip_code_prefix]
  products:
    file: "olist_products_dataset.csv"
    required_columns: [product_id]
    column_mapping: {product_id: product_id, product_category_name: product_category, product_name_lenght: product_name_length, product_description_lenght: product_description_length, product_photos_qty: product_photos_qty, product_weight_g: product_weight_g, product_length_cm: product_length_cm, product_height_cm: product_height_cm, product_width_cm: product_width_cm}
    id_columns: [product_id]
  geolocation:
    file: "olist_geolocation_dataset.csv"
    required_columns: [geolocation_zip_code_prefix, geolocation_lat, geolocation_lng, geolocation_city, geolocation_state]
    column_mapping: {geolocation_zip_code_prefix: zip_code_prefix, geolocation_lat: latitude, geolocation_lng: longitude, geolocation_city: city, geolocation_state: state}
    zip_columns: [geolocation_zip_code_prefix]
    numeric_columns: [geolocation_lat, geolocation_lng]
  sellers:
    file: "olist_sellers_dataset.csv"
    required_columns: [seller_id, seller_zip_code_prefix, seller_city, seller_state]
    column_mapping: {seller_id: seller_id, seller_zip_code_prefix: zip_code_prefix, seller_city: city, seller_state: state}
    id_columns: [seller_id]
    zip_columns: [seller_zip_code_prefix]
  order_items:
    file: "olist_order_items_dataset.csv"
    required_columns: [order_id, order_item_id, product_id, seller_id, price, freight_value]
    column_mapping: {order_id: order_id, order_item_id: order_item_id, product_id: product_id, seller_id: seller_id, price: item_price, freight_value: freight_value, shipping_limit_date: shipping_limit_date}
    id_columns: [order_id, product_id, seller_id]
    numeric_columns: [order_item_id, price, freight_value]
    positive_columns: [price]
  order_payments:
    file: "olist_order_payments_dataset.csv"
    required_columns: [order_id, payment_sequential, payment_type, payment_installments, payment_value]
    column_mapping: {order_id: order_id, payment_sequential: payment_sequential, payment_type: payment_type, payment_installments: payment_installments, payment_value: payment_value}
    id_columns: [order_id]
    numeric_columns: [payment_sequential, payment_installments, payment_value]
  product_category_translation:
    file: "product_category_name_translation.csv"
    required_columns: [product_category_name, product_category_name_english]
    column_mapping: {product_category_name: product_category, product_category_name_english: product_category_english}
  order_reviews:
    file: "olist_order_reviews_dataset.csv"
    required_columns: [review_id, order_id, review_score]
    column_mapping: {review_id: review_id, order_id: order_id, review_score: review_score, review_comment_title: review_comment_title, review_comment_message: review_comment_message, review_creation_date: review_creation_date, review_answer_timestamp: review_answer_timestamp}
    id_columns: [review_id, order_id]
    numeric_columns: [review_score]
    allowed_ranges: {review_score: [1, 5]}
  orders:
    file: "olist_orders_dataset.csv"
    required_columns: [order_id, customer_id, order_status, order_purchase_timestamp]
    column_mapping: {order_id: order_id, customer_id: customer_id, order_status: order_status, order_purchase_timestamp: order_purchase_timestamp, order_approved_at: order_approved_at, order_delivered_carrier_date: order_delivered_carrier_date, order_delivered_customer_date: order_delivered_customer_date, order_estimated_delivery_date: order_estimated_delivery_date}
    id_columns: [order_id, customer_id]
    allowed_values:
      order_status: [created, approved, invoiced, processing, shipped, delivered, unavailable, canceled]
